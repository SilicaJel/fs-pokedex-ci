name: Deployment pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize]

jobs:
  simple_deployment_pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Run ESLint
      run: npm run eslint
      
    - name: Run Jest tests
      run: npm test
      
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
      
    - name: Run Playwright tests
      run: npm run test:e2e
      
    - name: Build application
      run: npm run build
      
    - name: Deploy to production
      if: ${{ github.event_name == 'push' }}
      run: |
        echo "Deploying to production..."
        # Add your actual deployment commands here

  tag_release:
    needs: [simple_deployment_pipeline]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: '0'  # Required for git history
    
    - name: Bump version and push tag
      uses: anothrNick/github-tag-action@1.67.0  # Use latest version
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEFAULT_BUMP: patch  # This makes it default to patch version (0.0.x)
        WITH_V: true  # Adds 'v' prefix to tags (v1.0.0)
        RELEASE_BRANCHES: main
        VERBOSE: true  # Optional: shows more output